name: Feature request
description: Suggest an idea or improvement.
labels: ['type: feature', 'status: triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: serverless
    attributes:
      label: Serverless check
      options:
        - label: This feature can work without any server operated by the ssh-client project.
          required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
