name: Fuzz

on:
  schedule:
    - cron: '7 2 * * *'
  pull_request:
    paths:
      - fuzz/**
      - crates/importers/**
      - crates/telnet-proto/**
      - crates/mosh-proto/**
      - crates/vault/**
      - crates/term-intel/**
      - crates/session-log/**
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - ssh_config
          - known_hosts
          - putty_reg
          - csv_import
          - telnet_decode
          - mosh_datagram
          - vault_crdt
          - shell_integration
          - session_log_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-fuzz
      - name: Fuzz
        run: |
          secs="${{ github.event.inputs.seconds }}"
          if [ -z "$secs" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then secs=60; else secs=600; fi
          fi
          # The prebuilt cargo-fuzz is a musl binary and would default to the musl target,
          # which has no sanitizer support; fuzz against glibc explicitly.
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time="$secs" -rss_limit_mb=2048
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
