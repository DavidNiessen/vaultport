# Rebuilds the animated profile README every day at 02:17 UTC.
# Generated by Readme Studio: https://readme.niessen.dev/
name: Readme Studio

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - readme.config.json
      - .github/workflows/readme-studio.yml

permissions:
  contents: write

# One run per branch: a push to another branch must not cancel the run that publishes
# from the default branch.
concurrency:
  group: readme-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render the README
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DavidNiessen/readme-studio@v1
        with:
          config: readme.config.json
          asset-branch: readme-studio
          # Optional: a fine-grained token with read access to your profile
          # adds private contribution counts and exact totals.
          profile-token: ${{ secrets.PROFILE_TOKEN }}
