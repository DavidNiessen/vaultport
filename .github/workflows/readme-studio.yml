# Rebuilds the animated project README every day at 02:17 UTC.
# Generated by Readme Studio: https://readme.niessen.dev/
# Edit readme.config.json (or open it in the studio), never README.md: the bot rewrites it.
name: Readme Studio

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - readme.config.json
      - .github/workflows/readme-studio.yml

permissions:
  contents: read

concurrency:
  # Per branch: a push elsewhere must not cancel the run that publishes from main.
  group: readme-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render the README
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Pushes the rendered images to the readme-studio branch and commits README.md.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DavidNiessen/readme-studio@13e789050145e4ea0be695758a57522ad4deeddb # v1.2.0
        with:
          config: readme.config.json
          asset-branch: readme-studio
