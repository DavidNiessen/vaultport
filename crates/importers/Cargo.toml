[package]
name = "importers"
description = "Importers for other SSH clients' configurations (OpenSSH, known_hosts, CSV, PuTTY, MobaXterm, SecureCRT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
core-model = { path = "../core-model" }
base64 = "0.23"
csv = "1"
hmac = "0.12"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
