[package]
name = "hw-keys"
description = "Hardware-backed SSH keys: FIDO2 security keys (sk-*) and platform-bound biometric keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["fido2-hid"]
# FIDO2 security keys over USB HID (CTAP2). Only compiled on desktop targets; on Android
# and iOS the dependency is never pulled in, even with the feature enabled.
fido2-hid = ["dep:ctap-hid-fido2"]

[dependencies]
core-model = { path = "../core-model" }
async-trait = "0.1"
base64 = "0.22"
ed25519-dalek = "3"
getrandom = "0.3"
hex = "0.4"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
sha2 = "0.11"
ssh-key = { version = "=0.7.0-rc.12", default-features = false, features = ["std", "ecdsa", "p256", "ed25519"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
ctap-hid-fido2 = { version = "3.6", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
core-foundation = "0.10"
security-framework = { version = "3.7", default-features = false, features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Security_Credentials",
  "Security_Cryptography",
  "Security_Cryptography_Core",
  "Storage_Streams",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
