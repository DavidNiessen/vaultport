[package]
name = "local-ai"
description = "Optional, fully on-device natural-language to shell command generation (pinned GGUF models, llama.cpp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fs4 = { version = "1", default-features = false, features = ["sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
wiremock = "0.6"

[lints]
workspace = true
