[package]
name = "mosh-proto"
description = "Native Mosh client: AES-128-OCB3 datagrams, fragments, SSP state synchronisation and roaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
base64 = "0.22"
flate2 = "1"
ocb3 = { version = "0.2", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true
