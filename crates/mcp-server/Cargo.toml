[package]
name = "mcp-server"
description = "Minimal Model Context Protocol server (tools only) over newline-delimited JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread", "sync", "macros", "time"] }

[lints]
workspace = true
