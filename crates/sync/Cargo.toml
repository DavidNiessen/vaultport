[package]
name = "sync"
description = "Serverless end-to-end encrypted vault sync through user-owned storage (folder, WebDAV, S3, Git), encrypted export and device pairing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
vault = { path = "../vault" }
cloud-inventory = { path = "../cloud-inventory" }
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
core-model = { path = "../core-model" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[lints]
workspace = true
