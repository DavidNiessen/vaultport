[package]
name = "serial-io"
description = "Async serial console sessions over native serial ports or pluggable transports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["native"]
# Native serial ports through the `serialport` crate (desktop targets only; compiled out on
# Android and iOS, where the app provides a `SerialTransport`).
native = ["dep:serialport"]

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
serialport = { version = "4.10", optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.32", features = ["term", "fs"] }

[lints]
workspace = true
