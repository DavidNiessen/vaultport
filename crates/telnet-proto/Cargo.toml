[package]
name = "telnet-proto"
description = "Telnet client (RFC 854) with RFC 1143 option negotiation: sans-IO codec and tokio session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
