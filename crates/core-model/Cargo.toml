[package]
name = "core-model"
description = "Domain model (hosts, groups, identities, keys, snippets, rules) and configuration inheritance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "uuid", "serde_json"], optional = true }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
