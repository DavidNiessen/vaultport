[package]
name = "ssh-client-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

# Not part of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
importers = { path = "../crates/importers" }
telnet-proto = { path = "../crates/telnet-proto" }
mosh-proto = { path = "../crates/mosh-proto" }
vault = { path = "../crates/vault" }
term-intel = { path = "../crates/term-intel" }
session-log = { path = "../crates/session-log" }
serde_json = "1"
uuid = "1"

[profile.release]
debug = 1


[[bin]]
name = "ssh_config"
path = "fuzz_targets/ssh_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "known_hosts"
path = "fuzz_targets/known_hosts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "putty_reg"
path = "fuzz_targets/putty_reg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "csv_import"
path = "fuzz_targets/csv_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "telnet_decode"
path = "fuzz_targets/telnet_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mosh_datagram"
path = "fuzz_targets/mosh_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vault_crdt"
path = "fuzz_targets/vault_crdt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell_integration"
path = "fuzz_targets/shell_integration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_log_reader"
path = "fuzz_targets/session_log_reader.rs"
test = false
doc = false
bench = false
