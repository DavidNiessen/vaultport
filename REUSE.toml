version = 1
SPDX-PackageName = "vaultport"
SPDX-PackageSupplier = "David Niessen"
SPDX-PackageDownloadLocation = "https://github.com/DavidNiessen/vaultport"

[[annotations]]
path = ["**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 David Niessen and Vaultport contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["apps/desktop/public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "The respective font authors"
SPDX-License-Identifier = "OFL-1.1"
