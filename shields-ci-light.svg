<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="140" height="28" viewBox="0 0 140 28" fill="none" role="img" aria-label="fuzz: running">
<title>fuzz: running</title>
<style>
svg{color-scheme:light}
text{font-family:rs-inter, 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;}
.h{font-family:rs-space-grotesk, 'Space Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}
.t{fill:#17171c}.m{fill:#6a6a7c}.a{fill:#6366F1}.g{fill:#3438ed}.s{fill:#d1d1d6}.a2{fill:#8024b3}
.b{font-weight:700}
.fx{transform-box:fill-box;transform-origin:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.2)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateY(var(--y))}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shimmer{0%{transform:translateX(-120%)}60%,100%{transform:translateX(220%)}}
.in{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fadeIn .8s ease both}
.blink{animation:blink 1s step-end infinite}

@media (prefers-reduced-motion: reduce){
  *{animation-delay:0s!important;animation-duration:1ms!important;animation-iteration-count:1!important}
  .loop{animation:none!important}.loop-only{display:none}
}text{font-family:ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif}
.sh{animation:shimmer 6s ease-in-out infinite}
.spin{transform-box:view-box;transform-origin:77.7px 14px;animation:spin 1.1s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
.vseg{transform-box:fill-box;transform-origin:left;animation:growX .6s cubic-bezier(.2,.7,.2,1) 0.10s both}</style>
<defs>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d1d1d6" opacity="0.8"/></pattern>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#d1d1d6" stroke-width=".6" opacity="0.7"/></pattern>
<pattern id="lines" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" stroke="#d1d1d6" stroke-width=".8" opacity="0.5"/></pattern>
<linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#3438ed"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="cardFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fafafb" stop-opacity="0"/><stop offset="1" stop-color="#fafafb"/></linearGradient></defs>
<g class="fade" style="animation-delay:0.00s"><clipPath id="bc"><rect width="140" height="28" rx="5"/></clipPath><g clip-path="url(#bc)"><rect width="140" height="28" fill="#fafafb"/><rect x="63.7" width="76.3" height="28" fill="#9a6700" opacity=".12"/><rect class="sh loop loop-only" x="-60" width="48" height="28" fill="url(#shine)" transform="skewX(-20)" style="animation-delay:2.00s"/></g><rect x=".5" y=".5" width="139" height="27" rx="4.5" stroke="#9a6700" stroke-opacity="0.9"/><svg x="10" y="7" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.5 13.5 3.5v4.2c0 3.3-2.3 5.7-5.5 6.8-3.2-1.1-5.5-3.5-5.5-6.8V3.5z"/><path d="m5.5 8 1.8 1.8L10.8 6"/></svg><text x="30.0" y="18.1" font-size="11.5" fill="#6a6a7c" textLength="23.7" lengthAdjust="spacingAndGlyphs">fuzz</text><circle cx="77.7" cy="14" r="3.6" stroke="#9a6700" stroke-opacity=".35" stroke-width="1.6"/><path d="M77.7 10.4a3.6 3.6 0 0 1 3.6 3.6" stroke="#9a6700" stroke-width="1.6" stroke-linecap="round" class="spin loop"/><g class="fade" style="animation-delay:0.25s"><text x="85.7" y="18.1" font-size="11.5" fill="#9a6700" font-weight="700" textLength="43.7" lengthAdjust="spacingAndGlyphs">running</text></g></g>
</svg>
